# bcd, the better-compute node daemon, on every GPU node of an existing Kubernetes cluster.
#
# Before applying (namespace bcd-system):
#   kubectl -n bcd-system create configmap bcd-config \
#     --from-file=config.toml=config.toml --from-literal=server=https://compute.example.com
#   kubectl -n bcd-system create secret generic bcd-join --from-file=token=join-token
# config.toml starts from config.toml.example; the join token is minted for this cluster's pool,
# with one use per node (`better-compute join-tokens create --pool <pool> --max-uses <nodes>
# --out join-token`). Each node joins once with it; delete the Secret once every node has joined
# (the pods keep running without it).
#
# The machines stay the cluster's: bcd applies no host configuration ([host] units = false; the
# NVIDIA GPU operator owns the driver, toolkit and MIG), never reboots them, and takes no self-update
# (no [update] release_pins: roll out a new image instead).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bcd
  labels:
    app.kubernetes.io/name: bcd
    app.kubernetes.io/part-of: better-compute
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bcd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bcd
        app.kubernetes.io/part-of: better-compute
    spec:
      priorityClassName: system-node-critical
      # The host's view: its network (gateway session, tunnels), its PIDs, its devices.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      # bcd talks to its gateway only, never to the Kubernetes API with a pod identity.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Joins once: the identity lands in /var/lib/bcd on the host, and later starts find it there
        # and need no token.
        - name: join
          image: bcd
          args:
            - join
            - --config=/etc/bcd/config.toml
            - --server=$(BCD_SERVER)
            - --token-file=/var/run/bcd-join/token
          env:
            - name: BCD_SERVER
              valueFrom:
                configMapKeyRef:
                  name: bcd-config
                  key: server
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: config, mountPath: /etc/bcd, readOnly: true }
            - { name: data, mountPath: /var/lib/bcd }
            - { name: join-token, mountPath: /var/run/bcd-join, readOnly: true }
      containers:
        - name: bcd
          image: bcd
          args: [node, --config=/etc/bcd/config.toml]
          env:
            # The NVIDIA container runtime mounts nvidia-smi and the driver's utilities.
            - { name: NVIDIA_VISIBLE_DEVICES, value: all }
            - { name: NVIDIA_DRIVER_CAPABILITIES, value: utility }
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/bcd, readOnly: true }
            - { name: data, mountPath: /var/lib/bcd }
            - { name: run, mountPath: /run/bcd }
            # CDI specs of the holds bcd makes (containerd reads them from the host).
            - { name: cdi, mountPath: /etc/cdi }
            - { name: dev, mountPath: /dev }
            - { name: sys, mountPath: /sys }
            # The kubelet's device-plugin sockets (Binding.KUBERNETES).
            - { name: device-plugins, mountPath: /var/lib/kubelet/device-plugins }
            # logs.collect and the machine's identity.
            - { name: journal, mountPath: /var/log/journal, readOnly: true }
            - { name: machine-id, mountPath: /etc/machine-id, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: bcd-config
            items: [{ key: config.toml, path: config.toml }]
        - name: join-token
          secret:
            secretName: bcd-join
            # bcd join refuses a token file others can read.
            defaultMode: 0400
            optional: true
        - { name: data, hostPath: { path: /var/lib/bcd, type: DirectoryOrCreate } }
        - { name: run, hostPath: { path: /run/bcd, type: DirectoryOrCreate } }
        - { name: cdi, hostPath: { path: /etc/cdi, type: DirectoryOrCreate } }
        - { name: dev, hostPath: { path: /dev } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: device-plugins, hostPath: { path: /var/lib/kubelet/device-plugins, type: DirectoryOrCreate } }
        - { name: journal, hostPath: { path: /var/log/journal, type: DirectoryOrCreate } }
        - { name: machine-id, hostPath: { path: /etc/machine-id, type: File } }
        - { name: tmp, emptyDir: {} }
