// Payloads and results of the built-in v0.1 command kinds (PLAN.md §7.3). A Command carries the
// request in CommandBody.payload (google.protobuf.Any); the CommandUpdate carries the serialized
// result in `result`. The kind table (lane and flags) lives in @better-compute/protocol
// (`commandKinds`) and in the daemon's dispatcher; both must agree.
//
// Stability: FROZEN with agent/v1. Changes are additive only. Later kinds (diag.dcgm, wipe,
// deploy.*, boot.kexec, driver.invoke, daemon.upgrade, …) add their own messages.
syntax = "proto3";

package bettercompute.agent.v1;

option go_package = "github.com/better-compute/better-compute/daemon/gen/bettercompute/agent/v1;agentv1";

// ---------------------------------------------------------------------------------------------
// diag.nvml: lane control, retry-safe, attested. The v0.1 adopt acceptance check (§3.3 step 7).

message DiagNvmlRequest {
  // GPUs to check; empty checks every GPU.
  repeated string gpu_uuids = 1;
  // When non-zero, fewer visible GPUs fails the check "gpu.count".
  uint32 expected_gpu_count = 2;
}

message DiagNvmlResult {
  // Every check on every GPU passed.
  bool passed = 1;
  // GPUs visible to NVML.
  uint32 gpu_count = 2;
  string driver_version = 3;
  // Node-level checks, e.g. "nvml.init", "gpu.count".
  repeated DiagnosticCheck checks = 4;
  // Sorted by uuid.
  repeated GpuDiagnostic gpus = 5;
}

message GpuDiagnostic {
  string uuid = 1;
  bool passed = 2;
  // e.g. "ecc.uncorrectable", "row-remap.pending", "row-remap.failure", "pcie.link", "xid.recent".
  repeated DiagnosticCheck checks = 3;
}

message DiagnosticCheck {
  string name = 1;
  bool passed = 2;
  string message = 3;
}

// ---------------------------------------------------------------------------------------------
// inventory.refresh: lane control, retry-safe. The requested sections are (re)sent as
// InventorySection frames before the command succeeds.

message InventoryRefreshRequest {
  // Section names to send; empty sends every section.
  repeated string sections = 1;
  // Re-collect from the hardware first instead of resending the last collection.
  bool rescan = 2;
}

message InventoryRefreshResult {
  // Section name → SHA-256 of the section content as sent.
  map<string, bytes> section_hashes = 1;
}

// ---------------------------------------------------------------------------------------------
// logs.collect: lane bulk, retry-safe. Logs go to a presigned object-store URL, never over the
// session (P8). The bundle is scanned for bcjt_/biam_ tokens before upload.

message LogsCollectRequest {
  // Presigned HTTPS PUT URL.
  string upload_url = 1;
  // Headers the presigned request requires.
  repeated HttpHeader upload_headers = 2;
  // systemd units; empty means bcd's own units.
  repeated string units = 3;
  // How far back to collect.
  uint32 lookback_seconds = 4;
  // Upload cap; the bundle is truncated (oldest first) beyond it.
  uint64 max_bytes = 5;
  // Include the support bundle (bcd status, doctor, journal metadata, inventory).
  bool support_bundle = 6;
}

message HttpHeader {
  string name = 1;
  string value = 2;
}

message LogsCollectResult {
  uint64 uploaded_bytes = 1;
  // SHA-256 of the uploaded object.
  bytes sha256 = 2;
  bool truncated = 3;
  // e.g. "application/zstd".
  string content_type = 4;
}

// ---------------------------------------------------------------------------------------------
// node.reboot: lane control, retry-safe, self-terminating, destructive (signed from v0.2).
// Completes as SUCCEEDED{rebooted} once the daemon is back with another boot_id; never replayed.

message NodeRebootRequest {
  string reason = 1;
  // Wait before rebooting (lets the CommandUpdate RUNNING reach the gateway).
  uint32 delay_ms = 2;
}

message NodeRebootResult {
  // The boot that ran the command; CommandUpdate.boot_id is the new one.
  string previous_boot_id = 1;
}

// ---------------------------------------------------------------------------------------------
// gpu.reset: lane control, NOT retry-safe, attested, destructive (signed from v0.2). Used after a
// release and for remediation (XID 63). Fails for a GPU that still has processes or a live
// assignment.

message GpuResetRequest {
  // At least one GPU; an empty list fails "invalid-payload".
  repeated string gpu_uuids = 1;
}

message GpuResetResult {
  // Sorted by uuid.
  repeated GpuResetOutcome gpus = 1;
}

message GpuResetOutcome {
  string uuid = 1;
  bool reset = 2;
  // ECC and row-remap state read after the reset.
  bool healthy = 3;
  string message = 4;
}

// ---------------------------------------------------------------------------------------------
// v0.2 ramdisk kinds (PLAN.md Â§3.5, Â§11.1). Added additively to the frozen agent/v1.

// diag.dcgm: lane provision, retry-safe, attested. Commissioning (level 2) and acceptance (level 1).
message DiagDcgmRequest {
  // dcgmi diag -r level: 1 (seconds), 2 (~2 min), 3 (~15 min), 4 (long).
  uint32 level = 1;
  // GPUs to test; empty tests every GPU.
  repeated string gpu_uuids = 2;
}

message DiagDcgmResult {
  bool passed = 1;
  uint32 level = 2;
  // Node-level tests, e.g. "dcgm.deployment", "pcie.bandwidth".
  repeated DiagnosticCheck tests = 3;
  // Per-GPU tests, sorted by uuid.
  repeated GpuDiagnostic gpus = 4;
}

// wipe: lane provision, NOT retry-safe, attested, destructive (signed from v0.2). The Â§11.1
// invariant "ready only after a verified wipe" rests on this result's node signature.
message WipeRequest {
  WipeMode mode = 1;
  // Disks to wipe, by WWN or serial; empty wipes every non-removable disk.
  repeated string disks = 2;
}

enum WipeMode {
  WIPE_MODE_UNSPECIFIED = 0;
  // Partition tables, signatures and the first/last MiB of every disk.
  WIPE_MODE_QUICK = 1;
  // ATA secure erase / NVMe format with user-data erase.
  WIPE_MODE_SECURE_ERASE = 2;
  // Rotate the self-encrypting drive's media key.
  WIPE_MODE_CRYPTO_ERASE = 3;
}

message WipeResult {
  WipeMode mode = 1;
  // Sorted by id.
  repeated DiskWipe disks = 2;
}

message DiskWipe {
  // WWN, or the serial when the disk has no WWN.
  string id = 1;
  // How the disk was wiped, e.g. "nvme-format", "ata-secure-erase", "blkdiscard", "crypto-erase".
  string method = 2;
  // A read-back check confirmed the result.
  bool verified = 3;
  string message = 4;
}

// deploy.image: lane provision, NOT retry-safe, attested, destructive. Streams the image from
// the site cache (HTTP range reads) through decompression straight to the root disk, checking the
// SHA-256 inline (Â§3.5 step 4).
message DeployImageRequest {
  // HTTPS URL, normally the site agent's image cache.
  string url = 1;
  // SHA-256 of the image as stored (before decompression).
  bytes sha256 = 2;
  ImageFormat format = 3;
  ImageCompression compression = 4;
  RootDiskHint root_disk = 5;
  // Secret ref of the rendered user data (it embeds a single-use `provisioned` join token); the
  // agent fetches it with SecretRequest, never in the command.
  string user_data_ref = 6;
  // "cloud-init", "ignition" or "talos".
  string user_data_kind = 7;
  // Write for UEFI boot (EFI system partition) rather than legacy BIOS.
  bool uefi = 8;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_RAW = 1;
  IMAGE_FORMAT_QCOW2 = 2;
}

enum ImageCompression {
  IMAGE_COMPRESSION_UNSPECIFIED = 0;
  IMAGE_COMPRESSION_NONE = 1;
  IMAGE_COMPRESSION_ZSTD = 2;
  IMAGE_COMPRESSION_GZIP = 3;
}

// The disk to install to; the first non-empty field wins, and a hint matching no disk fails the step.
message RootDiskHint {
  string wwn = 1;
  string serial = 2;
  // e.g. "/dev/nvme0n1"; last resort, device names are not stable.
  string device = 3;
  // Smallest disk at least this big.
  uint64 min_size_bytes = 4;
}

message DeployImageResult {
  uint64 written_bytes = 1;
  // SHA-256 verified while streaming (equals the request's).
  bytes sha256 = 2;
  // WWN or serial of the disk written.
  string root_disk = 3;
  uint32 duration_ms = 4;
}

// boot.kexec: lane control, retry-safe, self-terminating. Boots the installed OS from the ramdisk
// without firmware POST; completes when the agent rejoins with a new boot_id and role `node`.
message KexecRequest {
  // Kernel and initrd paths on the installed root filesystem; empty means the distribution defaults.
  string kernel_path = 1;
  string initrd_path = 2;
  // Appended to the installed kernel command line.
  repeated string kernel_cmdline = 3;
}

message KexecResult {
  // The ramdisk boot that ran the command; the rejoining agent reports the new one.
  string previous_boot_id = 1;
}
