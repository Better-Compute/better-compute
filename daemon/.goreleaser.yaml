# goreleaser (v2.6 or later) configuration for bcd, PLAN.md §6 "Release artifacts".
#
# Run from daemon/:
#   goreleaser release --snapshot --clean --skip=sign,sbom   local build into daemon/dist/
#   goreleaser release --clean                tagged release (from .github/workflows/release.yml)
#
# Produces bcd_<version>_linux_{amd64,arm64}.tar.gz with a .sha256 file each. The install script
# downloads one archive and checks its sha256; the api serves both from
# GET {basePath}/downloads/bcd/{version}/{os}-{arch}.
version: 2

project_name: bcd

builds:
  - id: bcd
    main: ./cmd/bcd
    binary: bcd
    goos: [linux]
    goarch: [amd64, arm64]
    # go-nvml dlopens libnvidia-ml through cgo, so release builds need a C cross-compiler; zig cc
    # targets both architectures from one host (the alternative is per-architecture Docker buildx).
    # Release builds use no tags: real NVML and real hardware. -tags nonvml,fakehw is for tests.
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu.2.28{{- end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu.2.28{{- end }}
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: bcd
    formats: [tar.gz]
    name_template: "bcd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
  # The bare binary as well: the offline-signed release manifest lists it, the install script and
  # self-update verify and install exactly this file, and GET {basePath}/downloads/bcd/{version}/linux-{arch}
  # serves it (PLAN.md §6 Release artifacts).
  - id: bcd-binary
    formats: [binary]
    name_template: "bcd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  # One <archive>.sha256 per archive, next to it.
  split: true
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

# Supply chain (PLAN.md §6, §13, v1.0): an SPDX SBOM per archive (syft), and a keyless cosign
# signature + certificate for every artifact (archives, bare binaries, checksums, SBOMs), bound to
# the release workflow's OIDC identity. SLSA provenance comes from the release workflow (generic
# SLSA3 generator over artifacts.json). Local snapshots skip both:
#   goreleaser release --snapshot --clean --skip=sign,sbom
sboms:
  - id: archive
    artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: all

# Published by .github/workflows/release.yml, appended to the GitHub release of the tag (the npm
# publish job creates it; a manual tag works too).
release:
  mode: append
