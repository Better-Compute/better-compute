packages:
  - packages/*
  - examples/*
  - apps/*

# Keep in sync with `allowBuilds` in scripts/tooling.mjs (packed-smoke.mjs copies that one into its consumer).
allowBuilds:
  argon2: true
  better-sqlite3: true
  esbuild: true
  '@bufbuild/buf': false

# Several sessions share this tree: `pnpm exec`/`pnpm run` must never start an install on their own.
verifyDepsBeforeRun: false
