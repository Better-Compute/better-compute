name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck (tsc -b builds dist), vitest, check-deps, check-sql-now, umbrella --check, validate-packages
      - run: pnpm check
      # scripts/proto-gen.mjs --check: buf lint and committed generated code is current
      - run: pnpm proto:check
      # buf breaking against the committed proto/baseline.binpb (PLAN.md §16 P0 exit)
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/proto-gen.mjs --breaking
      # scripts/pack.mjs deletes every dist/, rebuilds with tsc -b, and packs into artifacts/
      - run: pnpm pack:all
      - run: pnpm check:packed-types
      # a fresh consumer installs every tarball (Better IAM from npm) and imports the umbrella
      - run: pnpm test:packed
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: better-compute-ci
          POSTGRES_DB: better_compute_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      BETTER_COMPUTE_POSTGRES_URL: postgres://postgres:better-compute-ci@localhost:5432/better_compute_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:postgres
  # Publishes the release allowlist (scripts/release-publish.mjs; never `pnpm publish -r`, which would also
  # publish aws-core and provider-digitalocean) to npm after a green push to main when any of them is not on npm
  # at the current version yet, then tags v<version> and creates the GitHub release with the version's
  # CHANGELOG.md section as its notes. Cut a release with `node scripts/release-version.mjs X.Y.Z` and a
  # `## X.Y.Z (YYYY-MM-DD)` section in CHANGELOG.md (RELEASING.md). A prerelease version (X.Y.Z-rc.N)
  # goes to the `next` dist-tag and is marked a prerelease on GitHub; every other version goes to `latest`.
  #
  # npm authentication. pnpm publish tries the first that works, per package:
  # 1. Trusted publishing (OIDC), no secret: needs `id-token: write` (below) and, on npmjs.com, a trusted
  #    publisher on each package for repository better-compute/better-compute, workflow `ci.yml` and
  #    environment `npm`. npm only lets you add one to a package that already exists, so a package's first
  #    publish needs route 2 or a manual publish (RELEASING.md).
  # 2. The NPM_TOKEN secret (an npm granular access token with publish rights on the @better-compute scope
  #    and the better-compute package), when the `npm` environment or the repository has one.
  # The "Decide whether to publish" step writes which applies to the job summary. Either way the packages
  # carry npm provenance (--provenance, signed with this job's OIDC identity).
  publish:
    needs: [test, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
      actions: write # dispatch release.yml (bcd artifacts) for the new tag
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pnpm 11 publishes with OIDC natively, and the
      # checks below use `npm view`.
      - run: npm install -g npm@^11.5.1
      - name: Decide whether to publish
        id: version
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/better-compute/package.json').version")
          if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
          unpublished=""
          while IFS= read -r name; do
            if ! npm view "$name@$version" version >/dev/null 2>&1; then unpublished="$unpublished $name"; fi
          # Only the release allowlist; --list fails when it disagrees with packages/*.
          done < <(node scripts/release-publish.mjs --list)
          publish=false
          if [ -z "$unpublished" ]; then
            echo "Every package is on npm at $version; nothing to publish."
          else
            # Every Better IAM range the packages declare (dependencies and peers) must resolve on npm, or
            # the published packages would not install.
            missing=""
            while IFS= read -r spec; do
              if [ -z "$(npm view "$spec" version 2>/dev/null || true)" ]; then missing="$missing $spec"; fi
            done < <(node -e 'const fs = require("fs"); const specs = new Set();
              for (const d of fs.readdirSync("packages")) {
                const p = `packages/${d}/package.json`;
                if (!fs.existsSync(p)) continue;
                const m = JSON.parse(fs.readFileSync(p, "utf8"));
                for (const field of ["dependencies", "peerDependencies", "optionalDependencies"])
                  for (const [n, range] of Object.entries(m[field] ?? {}))
                    if (n === "better-iam" || n.startsWith("@better-iam/")) specs.add(`${n}@${range}`);
              }
              for (const spec of specs) console.log(spec);')
            if [ -n "$missing" ]; then
              echo "::error::These Better IAM ranges resolve to nothing on npm:$missing"
              exit 1
            fi
            # The release notes; fails when CHANGELOG.md has no (or an empty) section for the version.
            node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
            publish=true
            if [ -n "$NPM_TOKEN" ]; then
              auth="trusted publishing (OIDC) for packages with a trusted publisher, the NPM_TOKEN secret for the rest"
            else
              auth="trusted publishing (OIDC) only: no NPM_TOKEN secret is set"
            fi
            {
              echo "### npm publish of $version (dist-tag \`$tag\`)"
              echo "Not on npm yet:$unpublished"
              echo
              echo "Authentication: $auth."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      # A clean build (scripts/pack.mjs deletes every dist/ and runs tsc -b) and the packed type checks,
      # so what is published is exactly what the checks saw.
      - if: steps.version.outputs.publish == 'true'
        run: pnpm pack:all
      - if: steps.version.outputs.publish == 'true'
        run: pnpm check:packed-types
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        # The release allowlist only, in dependency order. Versions already on npm are skipped, so a rerun
        # finishes a partial release.
        run: node scripts/release-publish.mjs --skip-build --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.version.outputs.tag }}
          # Empty when the secret is not set; pnpm then relies on trusted publishing alone.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Tag and create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BCD_RELEASE: ${{ vars.BCD_RELEASE }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then exit 0; fi
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease
          # bcd binaries for the tag (release.yml), only once the repository variable BCD_RELEASE is
          # `true`: no bcd binary is released yet. A tag created with GITHUB_TOKEN triggers no push
          # workflow; a dispatch does.
          if [ "$BCD_RELEASE" = "true" ]; then
            gh workflow run release.yml --ref main -f tag="v$VERSION"
          fi
