name: daemon
# The Go daemon `bcd` (PLAN.md §6). Logic builds and tests use the fake-hardware tags on every OS;
# the default (NVML, cgo) build is vetted on Linux, the only release target. Release artifacts come
# from goreleaser in release.yml (SBOMs, cosign, SLSA3 provenance); here `goreleaser check` only
# validates daemon/.goreleaser.yaml.
on:
  push:
    branches: [main]
    paths:
      - 'daemon/**'
      - 'proto/**'
      - 'packages/provider-kubernetes/**'
      - 'scripts/k8s-render-manifests.mjs'
      - '.github/workflows/daemon.yml'
  pull_request:
    paths:
      - 'daemon/**'
      - 'proto/**'
      - 'packages/provider-kubernetes/**'
      - 'scripts/k8s-render-manifests.mjs'
      - '.github/workflows/daemon.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: go vet (fake hardware)
        run: go vet -tags nonvml,fakehw ./...
      - name: go vet (NVML build)
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: go test
        run: go test -tags nonvml,fakehw ./...
      - name: goreleaser check
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
          workdir: daemon
  # The DaemonSet image (daemon/Containerfile) and its manifests (provider-kubernetes): the image builds
  # (with the sha256-pinned kubectl), its binaries run, and a real API server accepts the manifests
  # (server-side dry run on kind: schema, Pod Security admission on the namespace).
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: daemon
          file: daemon/Containerfile
          platforms: linux/amd64
          build-args: VERSION=0.0.0-ci
          tags: bcd:ci
          load: true
      - name: the image's binaries run
        run: |
          docker run --rm bcd:ci --version
          docker run --rm --entrypoint kubectl bcd:ci version --client
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: render the manifests
        run: node --import ./tests/fixtures/bcx-loader.mjs scripts/k8s-render-manifests.mjs bcd:ci "$RUNNER_TEMP/bcd.json"
      - uses: helm/kind-action@v1
        with:
          cluster_name: bcd-ci
      # A dry run creates nothing, so the namespaced objects need their Namespace for real first (with
      # its Pod Security labels, which then admit, or refuse, the DaemonSet's privileged pod).
      - name: the API server accepts them (server-side dry run)
        run: |
          jq '.items[] | select(.kind == "Namespace")' "$RUNNER_TEMP/bcd.json" | kubectl apply -f -
          kubectl apply --dry-run=server -f "$RUNNER_TEMP/bcd.json"
